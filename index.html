<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/destyle.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/index.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡易掲示板</title>
</head>
<body>
  <header>
    <h1>簡易掲示板</h1>
    <div class="mode">
      <label for="modeSelect">モード：</label>
      <select id="modeSelect">
        <option value="light">ライトモード</option>
        <option value="dark">ダークモード</option>
      </select>
    </div>
  </header>
  <main>
    <div class="theme">
      <h2>テーマ：雑談</h2>
    </div>
    <div class="createPost">
      <div class="setUsername">
        <label for="username">ニックネーム：</label>
        <input id="username" name="username" type="text" placeholder="名無し"/>
      </div>
      <div class="setComment">
        <textarea name="comment" id="commentInput" placeholder="話したいことを入力"></textarea>
        <p id="postButtonWrapper"><input type="submit" value="書き込む" id="postButton"></p>
      </div>
    </div>
    <div class="separator"></div>
    <div class="search">
      <div class="searchContent">
        <label for="searchInput">キーワード検索：</label>
        <input type="text" id="searchInput" placeholder="キーワードを入力">
        <button id="searchButton">検索</button>
        <button id="resetButton">検索結果リセット</button>
      </div>
    </div>
    <div class="separator"></div>
    <div class="sort">
      <label for="sortSelect">並び替え：</label>
      <select id="sortSelect">
        <option value="newest">新しい順</option>
        <option value="oldest">古い順</option>
      </select>
    </div>
    <div class="posts">
      <ul id="postList"></ul>
      <div id="paginationContainer">
        <button id="prevBtn">&lt;</button>
        <div id="pagination"></div>
        <button id="nextBtn">&gt;</button>
      </div>
    </div>
    <div id="customTooltip"></div>
  </main>
  <footer></footer>
</body>
</html>
