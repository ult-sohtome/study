<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/destyle.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/index.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡易掲示板</title>
</head>
<body>
  <header>
    <h1>簡易掲示板</h1>
  </header>
  <main>
    <div class="theme">
      <h2>テーマ：雑談</h2>
    </div>
    <div class="createPost">
      <div class="setUsername">
        <label for="username">ニックネーム：</label>
        <input id="username" name="username" type="text" placeholder="名無し"/>
      </div>
      <div class="setComment">
        <textarea name="comment" id="commentInput" placeholder="話したいことを入力"></textarea>
        <p id="postButtonWrapper"><input type="submit" value="書き込む" id="postButton"></p>
      </div>
    </div>
    <div class="separator"></div>
    <div class="posts">
      <ul id="postList"></ul>
      <div id="paginationContainer">
        <button id="prevBtn">&lt;</button>
        <div id="pagination"></div>
        <button id="nextBtn">&gt;</button>
      </div>
    </div>
  </main>
  <footer></footer>
</body>
</html>
